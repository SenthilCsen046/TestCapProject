_schema-version: 3.3.0
ID: TestCapProject
description: A simple CAP project.
version: 1.0.0
modules:
  - name: TestCapProject-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: TestCapProject-db
      - name: TestCapProject-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: TestCapProject-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: TestCapProject-db
    parameters:
      buildpack: nodejs_buildpack
  - name: TestCapProject-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: TestCapProject-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - testcapprojectnamespacetestcapproject.zip
          name: testcapprojectnamespacetestcapproject
          target-path: resources/
  - name: testcapprojectnamespacetestcapproject
    type: html5
    path: app/testcapproject
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
resources:
  - name: TestCapProject-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: TestCapProject-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: TestCapProject-html5-service
      service-plan: app-host
  - name: TestCapProject-destination-service
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: TestCapProject-destination-service
      service-plan: lite
  - name: TestCapProject-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: TestCapProject-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'productmanager (TestCapProject ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.productmanager'
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
